<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001438"/>
      <stop offset="100%" stop-color="#002b66"/>
    </linearGradient>
    <linearGradient id="shieldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Crown -->
  <g filter="url(#shadow)">
    <path d="M 33 26 L 37 15 L 43 23 L 50 12 L 57 23 L 63 15 L 67 26 Z" fill="url(#crownGrad)" stroke="#b45309" stroke-width="1"/>
    <circle cx="37" cy="14" r="1.8" fill="#fef08a"/>
    <circle cx="50" cy="11" r="2.2" fill="#fef08a"/>
    <circle cx="63" cy="14" r="1.8" fill="#fef08a"/>
  </g>

  <!-- Shield Outer Border -->
  <path d="M 23 27 L 77 27 L 77 65 L 50 88 L 23 65 Z" fill="#001026" stroke="#38bdf8" stroke-width="2.5" filter="url(#shadow)"/>

  <!-- Left Shield Half -->
  <path d="M 26 29 L 50 29 L 50 84 L 26 63 Z" fill="url(#shieldLeft)"/>

  <!-- Right Shield Half -->
  <path d="M 50 29 L 74 29 L 74 63 L 50 84 Z" fill="url(#shieldRight)"/>

  <!-- Center Monogram PSB -->
  <text x="50" y="60" font-family="'Arial Black', 'Impact', sans-serif" font-size="25" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">PSB</text>
</svg>